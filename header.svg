<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260" role="img" aria-label="Shekh Mohammed Imran - Azure DevOps Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1F3A"/>
      <stop offset="0.5" stop-color="#0078D4"/>
      <stop offset="1" stop-color="#00C7FF"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip"><rect width="1200" height="260" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="260" fill="url(#bg)"/>
    <circle cx="150" cy="60" r="120" fill="#fff" opacity="0.06">
      <animate attributeName="cx" values="150;300;150" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1050" cy="220" r="150" fill="#fff" opacity="0.07">
      <animate attributeName="cx" values="1050;900;1050" dur="14s" repeatCount="indefinite"/>
    </circle>
    <rect x="-400" y="0" width="400" height="260" fill="url(#shine)">
      <animate attributeName="x" values="-400;1200" dur="6s" repeatCount="indefinite"/>
    </rect>
    <text x="600" y="115" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#fff">
      Shekh Mohammed Imran
    </text>
    <text x="600" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#E6F9FF">
      Azure DevOps Engineer
    </text>
    <text x="600" y="202" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="17" fill="#CFEFFF">
      Azure Cloud  |  Terraform  |  CI/CD  |  GitOps  |  DevSecOps
    </text>
  </g>
</svg>
